
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dearest Munchie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Homemade+Apple&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --vintage-cream: #f2e8cf;
      --vintage-sepia: #3d2b1f;
      --vintage-brown: #8b4513;
      --vintage-tan: #d2b48c;
    }

    body {
      font-family: 'Special Elite', system-ui, serif;
      background-color: #2c1e14; /* Dark wood base */
      color: var(--vintage-sepia);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .desk-surface {
      background-color: #3d2b1f;
      background-image: url("https://www.transparenttextures.com/patterns/dark-wood.png");
      background-attachment: fixed;
    }

    .font-cursive { font-family: 'Dancing Script', cursive; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-typewriter { font-family: 'Special Elite', cursor; }
    .font-handwriting { font-family: 'Homemade Apple', cursive; }
    .font-elegant { font-family: 'Pinyon Script', cursive; }

    .paper-sheet {
      background-color: #fdf5e6;
      box-shadow: 
        2px 2px 0px rgba(0,0,0,0.1),
        5px 5px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(0,0,0,0.05);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .paper-sheet::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("https://www.transparenttextures.com/patterns/p6.png");
      opacity: 0.4;
      pointer-events: none;
    }

    .paper-stack {
      position: relative;
    }
    .paper-stack::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: -4px; bottom: -4px;
      background: #e6ddc5;
      z-index: -1;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .postcard {
      background-color: #efe6d5;
      border: 10px solid white;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
    }

    .wax-seal {
      width: 44px;
      height: 44px;
      background: #8b0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      font-weight: bold;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 2px 2px 5px rgba(0,0,0,0.3);
      cursor: pointer;
      position: relative;
    }

    .wax-seal::after {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px dashed rgba(255,215,0,0.2);
      border-radius: 50%;
    }

    .btn-vintage {
      background: #8b4513;
      color: #f2e8cf;
      border: 1px solid #5d2e0a;
      box-shadow: 3px 3px 0px #3d2b1f;
      transition: all 0.1s ease;
      background-image: url("https://www.transparenttextures.com/patterns/p6.png");
      text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
    }
    .btn-vintage:hover {
      background-color: #5d2e0a;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #3d2b1f;
    }
    .btn-vintage:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #3d2b1f;
    }

    .btn-paper-tab {
      background: #efe6d5;
      border: 1px solid #d2b48c;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      color: #8b4513;
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 0.2em;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.2s ease;
      background-image: url("https://www.transparenttextures.com/patterns/p6.png");
    }
    .btn-paper-tab:hover {
      background: #fdf5e6;
      border-color: #8b4513;
      color: #3d2b1f;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translate(100px, -100vh) rotate(45deg); opacity: 0; }
    }
    .dust-particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: drift 20s linear infinite;
      color: rgba(255, 255, 255, 0.1);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #2c1e14; }
    ::-webkit-scrollbar-thumb { background: #8b4513; border-radius: 4px; }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.4"
  }
}
</script>
</head>
<body class="desk-surface">
  <div id="root"></div>
</body>
</html>
