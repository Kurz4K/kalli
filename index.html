
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dearest Munchie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Special Elite', system-ui, serif;
      background-color: #f2e8cf; /* Vintage cream */
      color: #3d2b1f; /* Dark sepia */
      overflow-x: hidden;
    }
    .font-cursive {
      font-family: 'Dancing Script', cursive;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    .font-typewriter {
      font-family: 'Special Elite', cursor;
    }
    .letter-paper {
      background-color: #fdf5e6;
      background-image: 
        radial-gradient(circle at 2px 2px, rgba(0,0,0,0.05) 1px, transparent 0);
      background-size: 24px 24px;
      box-shadow: inset 0 0 100px rgba(139, 69, 19, 0.1), 0 5px 15px rgba(0,0,0,0.1);
      border: 1px solid #d2b48c;
    }
    .parchment-texture {
      background-color: #f2e8cf;
      background-image: url("https://www.transparenttextures.com/patterns/p6.png");
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.4; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      animation: float 15s linear infinite;
    }
    .btn-vintage {
      background: #8b4513;
      color: #f2e8cf;
      border: 2px solid #5d2e0a;
      transition: all 0.2s ease;
    }
    .btn-vintage:hover {
      background: #5d2e0a;
      transform: translateY(-1px);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.4"
  }
}
</script>
</head>
<body class="parchment-texture">
  <div id="root"></div>
</body>
</html>
